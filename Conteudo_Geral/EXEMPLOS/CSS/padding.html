<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Padding no CSS</title>
    <style>
        #bt1{
            padding: 10px;
        }

        #bt2{
            padding: 50px;
        }

        #bt3{
            padding: 100px;
        }
    </style>
</head>
<body>
    <button id="bt1">Padding 10px</button>
    <button id="bt2">Padding 50px</button>
    <button id="bt3">Padding 100px</button>
</body>
</html>
